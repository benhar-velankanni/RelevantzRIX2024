<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms</title>
    <style>
      body {  
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: auto;
        margin: 0;
        background-color: #000000;
        color: black;
      }
      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        vertical-align: center;
        background-color: #ffffff;
        width: 400px;
        min-height: 300px;
        border-radius: 10px;
        padding: 50px;
        margin-bottom: 20px;
      }
      label {
        margin-bottom: 0.5rem;
      }
      input {
        margin-bottom: 1rem;
        padding: 0.5rem;
        border-radius: 5px;
        border: 1px solid black;
      }
      button {
        padding: 0.5rem 1rem;
        border-radius: 5px;
        background-color: green;
        color: #f0f0f0;
        border: none;
        cursor: pointer;
        transition: 0.3s ease-in-out;
      }
      button:hover {
        background-color: #ffffff;
        border: 1px solid black;
        color: black;
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1 style="display: flex; justify-content: center; color: white">
        Forms
      </h1>
      <main>
        <form id="productForm" novalidate>
          <h3 style="display: flex; justify-content: center">Product Form</h3>
          <label for="productName">Name:</label>
          <input type="text" id="productName" name="name" />
          <label for="price">Price:</label>
          <input type="number" id="price" name="price" />
          <label for="inStock">In Stock:</label>
          <input type="checkbox" id="inStock" name="inStock" />
          <button type="submit">Submit</button>
        </form>
        <form id="bookForm" novalidate>
          <h3 style="display: flex; justify-content: center">Book Form</h3>
          <label for="bookTitle">Title:</label>
          <input type="text" id="bookTitle" name="title" />
          <label for="author">Author:</label>
          <input type="text" id="author" name="author" />
          <label for="pages">Pages:</label>
          <input type="number" id="pages" name="pages" />
          <label for="isAvailable">Is Available:</label>
          <input type="checkbox" id="isAvailable" name="isAvailable" />
          <button type="submit">Submit</button>
        </form>
        <form id="carForm" novalidate>
          <h3 style="display: flex; justify-content: center">Car Form</h3>
          <label for="carMake">Make:</label>
          <input type="text" id="carMake" name="make" />
          <label for="carModel">Model:</label>
          <input type="text" id="carModel" name="model" />
          <label for="year">Year:</label>
          <input type="number" id="year" name="year" />
          <label for="isRunning">Is Running:</label>
          <input type="checkbox" id="isRunning" name="isRunning" />
          <button type="submit">Submit</button>
        </form>
        <form id="employeeForm" onsubmit="handleFormSubmit(event)" novalidate>
          <h3 style="display: flex; justify-content: center">Employee Form</h3>
          <label for="employeeName">Name:</label>
          <input type="text" id="employeeName" name="name" />
          <label for="position">Position:</label>
          <input type="text" id="position" name="position" />
          <label for="salary">Salary:</label>
          <input type="number" id="salary" name="salary" />
          <label for="isFullTime">Is Full Time:</label>
          <input type="checkbox" id="isFullTime" name="isFullTime" />
          <button type="submit">Submit</button>
        </form>
        <form id="courseForm" novalidate>
          <h3 style="display: flex; justify-content: center">Course Form</h3>
          <label for="courseTitle">Title:</label>
          <input type="text" id="courseTitle" name="title" />
          <label for="instructor">Instructor:</label>
          <input type="text" id="instructor" name="instructor" />
          <label for="duration">Duration (hours):</label>
          <input type="number" id="duration" name="duration" />
          <label for="isOnline">Is Online:</label>
          <input type="checkbox" id="isOnline" name="isOnline" />
          <button type="submit">Submit</button>
        </form>
      </main>
    </div>
    <script type="module">
      import { handleFormSubmit } from "./src/main.ts";

      document.getElementById("productForm").onsubmit = handleFormSubmit;
      document.getElementById("bookForm").onsubmit = handleFormSubmit;
      document.getElementById("carForm").onsubmit = handleFormSubmit;
      document.getElementById("employeeForm").onsubmit = handleFormSubmit;
      document.getElementById("courseForm").onsubmit = handleFormSubmit;
    </script>
  </body>
</html>
