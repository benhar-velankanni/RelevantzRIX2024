        <h3 style="text-decoration: underline;">If-else-if</h3>
        <h2 id="ifelse">Before</h2>
        <script>
            let result;

            if(mark>70){

         <h3 style="text-decoration: underline;">Switch</h3>
         <h2 id="Switch">Before</h2>
         <script>
            let result2;
            let age1=20;
            switch(age1){
                case 20:
                    result2="Qualifies for driving";
                    break;
                    case 18:
                        result2="qualifies for driving";
                        break;
                     default:
                            result2="Not eligible for driving";
            }
            document.getElementById("Switch").innerHTML=result2;
         </script>
         <h1>Looping Statement</h1>
         <h2 style="text-decoration: underline;">Do-while</h2>
         <p id="Do-while">Before</p>
         <script>
            let i=0;
            let text="";
            do{
                text+="The number is " + i + "<br>";
                i++;
            }
            while(i<5);
            document.getElementById("Do-while").innerHTML=text;
         </script>

        <p id="txt"></p>
            <script>
                function startTime() {
                  const today = new Date();
                  let h = today.getHours();
                  let m = today.getMinutes();
                  let s = today.getSeconds();
                  m = checkTime(m);
                  s = checkTime(s);
                  document.getElementById('txt').innerHTML =  h + ":" + m + ":" + s;
                  setTimeout(startTime, 1000);
                }
                 
                function checkTime(i) {
                  if (i < 10) {i = "0" + i};  // add zero in front of numbers < 10
                  return i;
                }
                </script>
