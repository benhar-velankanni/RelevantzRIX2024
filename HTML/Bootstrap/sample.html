<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Registration Form</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    body {
        background: url('https://www.shutterstock.com/shutterstock/videos/1109598135/thumb/1.jpg?ip=x480') no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .container {
        background: rgba(255, 255, 255, 0.8);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
    }
</style>

<body>
    <div class="container mt-5">
        <h2 class="text-center">Employee Registration</h2>
        <form>
            <div class="mb-3">
                <label for="empName" class="form-label">Employee Name</label>
                <input type="text" class="form-control" id="empName" placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="empEmail" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="empEmail" placeholder="Enter your email">
            </div>
            <div class="mb-3">
                <label for="empPhone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="empPhone" placeholder="Enter your phone number">
            </div>
            <div class="mb-3">
                <label for="empDept" class="form-label">Department</label>
                <select class="form-select" id="empDept">
                    <option selected>Select department</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Finance">Finance</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
