<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Days Until Christmas</title>
</head>
<body>
    <h1>Days Until Next Christmas</h1>
    <p id="days-left"></p>
 
    <script>
        function daysUntilChristmas() {
            const today = new Date();
            const currentYear = today.getFullYear();
            let christmas = new Date(currentYear, 11, 25); // December 25 of the current year
 
            // If Christmas has already passed this year, calculate for next year
            if (today > christmas) {
                christmas = new Date(currentYear + 1, 11, 25);
            }
 
            const oneDay = 24 * 60 * 60 * 1000; // Milliseconds in a day
            const daysLeft = Math.ceil((christmas - today) / oneDay);
 
            return daysLeft;
        }
 
        document.getElementById('days-left').textContent =
            `There are ${daysUntilChristmas()} days left until next Christmas!`;
    </script>
</body>
</html>
