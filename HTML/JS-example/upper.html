<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .center-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
    </style>
</head>
<body>
    <div style="height: 400px; width: 400px; background-color: rgb(171, 224, 238); margin-top: 50px; margin-left: 30px;">
        <div class="center-form">
            <form>
                <h3>Enter the String:</h3>
                <input type="text" name="string" id="in" style="margin-bottom: 20px;">
                <input type="button" value="convert" onclick="convertString()">
            </form>
            <h4 id="res"></h4>
        </div>
    </div>

    <script>
        function capitalize(str) {
            return str.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function convertString() {
            const inputString = document.getElementById('in').value;
            const result = capitalize(inputString);
            document.getElementById('res').innerText = result;
        }
    </script>
</body>
</html>
