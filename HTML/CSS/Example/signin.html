<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css"
</head>
<body>
    <div class="container">
    <table>
        <form>
            <tr>
                <h2>SIGN-IN</h2>
            </tr>
            <tr>
                <td>
                    <h3>Enter Your Name</h3>
                </td>
                <td>
                    <input type="text" class="text" placeholder="&#x1F464;">
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Enter Your Email</h3>
                </td>
                <td>
                    <input type="email" class="text" placeholder="&#128231;">
                </td>
            </tr>

            <tr>
                <td>
                    <h3>Enter  your Password</h3>
                </td>
                <td>
                    <input type="password" class="text" placeholder="&#128274;">
                </td>
            </tr>
            
            <tr>
                <td>
                    <h3>Date of Birth</h3>
                </td>
                <td>
                    <input type="date" class="text">
                </td>
            </tr>
            <tr>
                <td>
                    <h3>Mobile Number</h3>
                </td>
                <td>
                    <input type="number" class="text" placeholder="&#128383;">
                </td>
            </tr>
            
                
                  
                
            
        </form>
    </table>
    <center>
        <button type="submit" class="btn" onclick="location.href='otp.html'">Submit</button>
    </center>
    </div>
</body>
</html>
