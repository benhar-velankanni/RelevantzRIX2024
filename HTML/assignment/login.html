<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f0f0f0;">
    <div style="width: 200px; padding: 20px; background-color: #4caf50; color: white; text-align: center; border-radius: 5px;">
        <h3>Login</h3>
        <input type="text" placeholder="Username" style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        <input type="password" placeholder="Password" style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        <button style="width: 100%; padding: 5px; background-color: #ffffff; color: #4caf50; border: none; border-radius: 3px; cursor: pointer;">Login</button>
    </div>
</body>
</html>
