<!DOCTYPE html>
<html>
<head>
    <title>Product Registration Form</title>
</head>
<body>
    <h2 style="text-align: center;">Product Registration Form</h2>
    <form action="login.html" method="POST" style="width: 300px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;">
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        
        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        
        <label for="product">Product Name:</label><br>
        <input type="text" id="product" name="product" required style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        
        <label for="serial">Serial Number:</label><br>
        <input type="text" id="serial" name="serial" required style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        
        <label for="date">Purchase Date:</label><br>
        <input type="date" id="date" name="date" required style="width: 100%; margin-bottom: 10px; padding: 5px;"><br>
        
        <label for="comments">Additional Comments:</label><br>
        <textarea id="comments" name="comments" rows="4" style="width: 100%; margin-bottom: 10px; padding: 5px;"></textarea><br>
        
        <button type="submit" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Submit
        </button>
    </form>
</body>
</html>
