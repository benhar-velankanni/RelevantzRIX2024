<!DOCTYPE html>
<html>
<head>
    <title>Timetable</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <table style="border-collapse: collapse; width: 80%; max-width: 600px; background-color: white; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
        <tr>
            <th style="padding: 10px; background-color: #4CAF50; color: white; border: 1px solid #ddd;">Day</th>
            <th style="padding: 10px; background-color: #af634c; color: white; border: 1px solid #ddd;">Time</th>
            <th style="padding: 10px; background-color: #af4c93; color: white; border: 1px solid #ddd;">Subject</th>
        </tr>
        <tr>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">Monday</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">9:00 AM - 10:00 AM</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">Mathematics</td>
        </tr>
        <tr>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">Monday</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">10:15 AM - 11:15 AM</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">Science</td>
        </tr>
        <tr>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">Tuesday</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">9:00 AM - 10:00 AM</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">History</td>
        </tr>
        <tr>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">Tuesday</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">10:15 AM - 11:15 AM</td>
            <td style="padding: 10px; text-align: center; border: 1px solid #ddd;">English</td>
        </tr>
    </table>
</body>
</html>
