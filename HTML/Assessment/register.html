<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
    <style>

        .container-fluid
        {
            width: 50vh;
        
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
            margin-top: 100px;
            background-image: url('https://img.freepik.com/premium-photo/stationery-accessories-isolated-white-background-office-supplies-products-top-view-with-copy-space-generative-ai_379823-9133.jpg');
            font-family:Arial, Helvetica, sans-serif
        }
        .btn{
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
       
    </style>
</head>
<body>
    
    <div class="container-fluid">
        <form action="login.html" onsubmit="return validation()">
            <h1 style="text-align: center;">Register</h1>
            <table>
                <tr>
                    <td>
                        <h5>Username</h5>
                    </td>
                    <td>
                        <input type="text" name="username" id="username">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Age</h5>
                    </td>
                    <td>
                        <input type="number" name="age" id="age">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Password</h5>
                    </td>
                    <td>
                        <input type="password" name="password" id="password">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Confirm Password</h5>
                    </td>
                    <td>
                        <input type="password" name="cpassword" id="cpassword">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Email</h5>
                    </td>
                    <td>
                        <input type="email" name="email" id="email">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Phone Number</h5>
                    </td>
                    <td>
                        <input type="number" name="phone" id="phone">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Date of Birth</h5>
                    </td>
                    <td>
                        <input type="date" name="dob" id="dob">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Address</h5>
                    </td>
                    <td>
                        <input type="text" name="address" id="address">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Gender</h5>
                    </td>
                    <td>
                        <input type="radio" name="gender" id="male" value="male"> Male
                        <input type="radio" name="gender" id="female" value="female"> Female
                    </td>
                </tr>
                <tr>
                    <td>
                        <h5>Occupation</h5>
                    </td>
                    <td>
                        <select name="occupation" id="occupation">
                            <option value="">Select</option>
                            <option value="teacher">Teacher</option>
                            <option value="engineer">Engineer</option>
                            <option value="doctor">Doctor</option>
                        </select>
                    </td>
                </tr>
            </table>
            <button type="submit" class="btn">Sign in</button>
        </form>
    </div>
</div>
<script src="signinvalidation.js"></script>
    
</body>
</html>
