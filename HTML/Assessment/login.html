<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<style>
    .container-fluid {
        width: 20%;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
        margin-top: 100px;
        background-image: url('https://mrwallpaper.com/images/thumbnail/stars-in-circles-cute-yellow-phone-0g52w33mamr0ptts.jpg');
    }
    .btn {
        width: 100%;
        padding: 10px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }
    .btn-hover {
        background-color: blue;
    }
</style>
<body>
    <div class="container-fluid">
        <h1 style="text-align: center;">Login</h1>
        <form action="main.html" onsubmit="return validateForm()">
            <table>
                <tr>
                    <td>
                        <h4>Username</h4>
                    </td>
                    <td>
                        <input type="text" name="username" id="username">
                    </td>
                </tr>
                <tr>
                    <td>
                        <h4>Password</h4>
                    </td>
                    <td>
                        <input type="password" name="password" id="password">
                    </td>
                </tr>
            </table>
            <input type="submit" class="btn" value="Login">
        </form>
        <a href="register.html"><h3 style="text-align: center;">Not Registered? Sign in</h3></a>
    </div>

    <script>
        function validateForm() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            if (username == "") {
                alert("Please enter your username");
                return false;
            }

            if (password == "") {
                alert("Please enter your password");
                return false;
            }

            // If all fields are valid, allow form submission
            return true;
        }
    </script>
</body>
</html>
