<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
      }
      form {
        width: 300px;
        margin: 40px auto;
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      select {
        width: 100%;
        padding: 10px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button[type="submit"] {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      button[type="submit"]:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div>
      <label for="formSelect">Choose a form to display:</label>
      <select id="formSelect" onchange="toggleForms()">
        <option value="exampleform">Example Form</option>
        <option value="products">Product Form</option>
        <option value="Book">Book Form</option>
        <option value="Car">Car Form</option>
      </select>
    </div>
 
    <div id="formContainer">
      <form id="exampleform" style="display: none;">
        <label for="textInput">Name: </label>
        <input type="text" id="textInput"><br><br>
        <label for="pass">Password: </label>
        <input type="password" id="pass"><br><br>
        <label for="selectInput">Select: </label>
        <label for="checkboxInput">Terms and Condition</label>
        <input type="checkbox" id="checkboxInput"><br><br>
        <button type="submit">Submit</button>
      </form>
 
      <form id="products" style="display: none;">
        <label>Name of the Product:</label>
        <input type="text" id="pname"><br><br>
        <label>Price:</label>
        <input type="text" id="pprice"><br><br>
        <label for="pcheckbox">Product Availability</label>
        <input type="checkbox" id="pcheckbox"><br><br>
        <button type="submit">Submit</button>
      </form>
      <form id="Book" style="display: none;">
        <label>Title:</label>
        <input type="text" id="btitle"><br><br>
        <label>Author:</label>
        <input type="text" id="bauthor"><br><br>
        <label>Pages:</label>
        <input type="number" id="bpage"><br><br>
        <label for="bcheckbox">Book Instock:</label>
        <input type="checkbox" id="bcheckbox"><br><br>
        <button type="submit">Submit</button>
      </form>
      <form id="Car" style="display: none;">
        <label>Make:</label>
        <input type="text" id="make"><br><br>
        <label>Model:</label>
        <input type="text" id="model"><br><br>
        <label>Year:</label>
        <input type="number" id="year"><br><br>
        <label for="ccheckbox">Is Car Running:</label>
        <input type="checkbox" id="ccheckbox"><br><br>
        <button type="submit">Submit</button>
      </form>
    </div>
 
    <script>
      function toggleForms() {
        const selectedForm = document.getElementById('formSelect').value;
        document.getElementById('exampleform').style.display = selectedForm === 'exampleform' ? 'block' : 'none';
        document.getElementById('products').style.display = selectedForm === 'products' ? 'block' : 'none';
        document.getElementById('Book').style.display = selectedForm === 'Book' ? 'block' : 'none';
        document.getElementById('Car').style.display = selectedForm === 'Car' ? 'block' : 'none';
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
