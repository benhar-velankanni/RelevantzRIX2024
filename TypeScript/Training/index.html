<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1 id="one">Product Form</h1>
    <div className="Main-container">
      <div className="Product-container">
        <form id="productform">
          <table>
            <tr>
              <td><label htmlFor="name">Name:</label></td>
              <td><input type="text" id="name" name="name" placeholder="Enter your name"/></td>
            </tr>
            <tr>
              <td><label htmlFor="price">Price:</label></td>
              <td><input type="number" id="price" name="price" placeholder="Enter your price"/></td>
            </tr>
            <tr>
              <td><label htmlFor="inStock">In Stock:</label></td>
              <td><input type="checkbox" id="inStock" name="inStock" /></td>
            </tr>
            <tr><td><button type="submit">Submit</button></td>
            </tr>
          </table>
        </form>
      </div>
      <hr>
      <h1 id="two">Book Form</h1>
      <div className="Book-container">
        <form id="bookform">
          <table>
            <tr><td><label htmlFor="title">Title:</label></td>
              <td><input type="text" id="title" name="title" placeholder="Enter your title"/></td>
            </tr>
            <tr><td><label htmlFor="author">Author:</label></td>
              <td><input type="text" id="author" name="author"  placeholder="Enter your author"/></td>
            </tr>
            <tr><td> <label htmlFor="pages">Pages:</label></td>
              <td><input type="number" id="pages" name="pages" placeholder="Enter your pages"/></td>
            </tr>
            <tr><td><label htmlFor="isAvailable">Is Available:</label></td>
              <td><input type="checkbox" id="isAvailable" name="isAvailable" /></td>
            </tr>
            <tr><td><button type="submit">Submit</button></td>
            </tr>
          </table>
        </form>
      </div>
      <hr>
      <h1 id="three">Car Form</h1>
      <div className="Car-container">
        <form id="carform">
          <table>
            <tr><td><label htmlFor="make">Make:</label></td>
              <td><input type="text" id="make" name="make" placeholder="Enter your make"/></td>
            </tr>
            <tr><td><label htmlFor="model">Model:</label></td>
              <td><input type="text" id="model" name="model" placeholder="Enter your model"/></td>
            </tr>
            <tr><td><label htmlFor="year">Year:</label></td>
              <td><input type="number" id="year" name="year" placeholder="Enter your year"/></td>
            </tr>
            <tr><td><label htmlFor="color">Color:</label></td>
              <td><input type="text" id="color" name="color" placeholder="Enter your color"/></td>
            </tr>
            <tr><td><button type="submit">Submit</button></td>
            </tr>
          </table>
        </form>
      </div>
      <hr>
      <h1 id="four">Employee Form</h1>
      <div className="Employee-container">
        <form id="employeeform">
          <table>
            <tr><td><label htmlFor="name">Name:</label></td>
              <td><input type="text" id="name" name="name" placeholder="Enter your name"/></td>
            </tr>
            <tr><td><label htmlFor="age">Age:</label></td>
              <td><input type="number" id="age" name="age" placeholder="Enter your age"/></td>
            </tr>
            <tr><td><label htmlFor="salary">Salary:</label></td>  
              <td><input type="number" id="salary" name="salary" placeholder="Enter your salary"/></td>
            </tr>
            <tr><td><label htmlFor="position">Position:</label></td>
              <td><input type="text" id="position" name="position" placeholder="Enter your position"/></td>
            </tr>
            <tr><td><button type="submit">Submit</button></td>
            </tr>
          </table>
        </form>
      </div>
      <hr>
      <h1 id="five">Course Form</h1>
      <div className="Course-container">
        <form id="courseform">
          <table>
            <tr><td><label htmlFor="name">Name:</label></td>
              <td><input type="text" id="name" name="name" placeholder="Enter your name"/></td>
            </tr>
            <tr><td><label htmlFor="price">Price:</label></td>
              <td><input type="number" id="price" name="price" placeholder="Enter your price"/></td>
            </tr> 
            <tr><td><label htmlFor="inStock">In Stock:</label></td>
              <td><input type="checkbox" id="inStock" name="inStock" /></td>
            </tr>
            <tr><td><button type="submit">Submit</button></td>
            </tr>
          </table>
        </form>
      </div>
    <script type="module">
      import { handleSubmit } from '/src/main.ts';
      var but=document.getElementById("one");
      but.addEventListener("click",function(){
        document.getElementById("productform").style.display="block";
      })
      </script>
      <script type="module">
      import { handleSubmit } from '/src/main.ts';
      var but=document.getElementById("two");
      but.addEventListener("click",function(){
        document.getElementById("bookform").style.display="block";
      })
      </script>
      <script type="module">
      import { handleSubmit } from '/src/main.ts';
      var but=document.getElementById("three");
      but.addEventListener("click",function(){
        document.getElementById("carform").style.display="block";
      })
      </script>
      <script type="module">
      import { handleSubmit } from '/src/main.ts';
      var but=document.getElementById("four");
      but.addEventListener("click",function(){
        document.getElementById("employeeform").style.display="block";
      })
      </script>
      <script type="module">
      import { handleSubmit } from '/src/main.ts';
      var but=document.getElementById("five");
      but.addEventListener("click",function(){
        document.getElementById("courseform").style.display="block";
      })
 
      document.getElementById("productform").onsubmit = handleSubmit;
      document.getElementById("bookform").onsubmit = handleSubmit;
      document.getElementById("carform").onsubmit = handleSubmit;
      document.getElementById("employeeform").onsubmit = handleSubmit;
      document.getElementById("courseform").onsubmit = handleSubmit;
    </script>
  </body>
</html>
