<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

<body>
  <h1 class="title">CRUD Operations</h1>
<h2 class="subtitle">Create</h2>
<form action="" class="create-form">
  <div>
    <label for="c_id" class="label">ID:</label>
    <input type="number" name="id" id="c_id" class="input">
  </div>
  <div>
    <label for="name" class="label">Name:</label>
    <input type="text" name="name" id="name" class="input">
  </div>
  <div>
    <label for="email" class="label">Email:</label>
    <input type="email" name="email" id="email" class="input">
  </div>
  <div>
    <button type="button" id="create" class="button">Create</button>
  </div>
</form>

<h2 class="subtitle">Read</h2>
<form action="" class="read-form">
  <div>
    <button type="button" id="read" class="button">Get Users</button>
  </div>
</form>

<h2 class="subtitle">Update</h2>
<form action="" class="update-form">
  <div>
    <label for="update-id" class="label">ID:</label>
    <input type="number" name="id" id="update-id" class="input">
  </div>
  <div>
    <label for="update-name" class="label">Name:</label>
    <input type="text" name="name" id="update-name" class="input">
  </div>
  <div>
    <label for="update-email" class="label">Email:</label>
    <input type="email" name="email" id="update-email" class="input">
  </div>
  <div>
    <button type="button" id="update" class="button">Update</button>
  </div>
</form>

<h2 class="subtitle">Delete</h2>
<form action="" class="delete-form">
  <div>
    <label for="delete-id" class="label">ID:</label>
    <input type="number" name="id" id="delete-id" class="input">
  </div>
  <div>
    <button type="button" id="delete" class="button">Delete</button>
  </div>
</form>

<h2 class ="subtitle">Transaction Management System</h2>
<form action="" class="create-trans-form">
  <div>
    <label for="trans-id">Trans Id:</label>
    <input type="number" name="trans-id" id="trans-id" class="input">
  </div>
  <div>
    <label for="trans-name">Trans Name:</label>
    <input type="text" name="trans-name" id="trans-name" class="input">
  </div>
  <div>
    <label for="trans-description">Trans Description:</label>
    <input type="text" name="trans-description" id="trans-description" class="input">
  </div>
  <div>
    <label for="trans-mode">Trans Mode:</label>
    <input type="text" name="trans-mode" id="trans-mode" class="input">
  </div>
  <div>
    <button type="button" id="create-trans" >Create</button>
  </div>
</form>

<h2 class ="subtitle">Read</h2>
<div>
  <button type="button" id="read-trans">Get Transactions</button>
</div>

<h2 class ="subtitle">Update</h2>
<form action="" class="update-trans-form">
  <div>
    <label for="update-trans-id">Trans Id:</label>
    <input type="number" name="update-trans-id" id="update-trans-id" class="input">
  </div>
  <div>
    <label for="update-trans-name">Trans Name:</label>
    <input type="text" name="update-trans-name" id="update-trans-name" class="input">
  </div>
  <div>
    <label for="update-trans-description">Trans Description:</label>
    <input type="text" name="update-trans-description" id="update-trans-description" class="input">
  </div>
  <div>
    <label for="update-trans-mode">Trans Mode:</label>
    <input type="text" name="update-trans-mode" id="update-trans-mode" class="input">
  </div>
  <div>
    <button type="button" id="update-trans">Update</button>
  </div>
</form>
<h2 class ="subtitle">Delete</h2>
<form action="" class="delete-trans-form">
  <div>
    <label for="delete-trans-id">Trans Id:</label>
    <input type="number" name="delete-trans-id" id="delete-trans-id" class="input">
  </div>
  <div>
    <button type="button" id="delete-trans">Delete</button>
  </div>
</form>
