<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <title>Bootstrap Demo</title>
    <style>
      body {
        background-color: #f8f9fa;
        color: #343a40;
      }
      .carousel-inner img {
        height: 300px;
        object-fit: cover;
      }
      .container {
        padding-top: 20px;
      }
      .container h1 {
        font-family: "Arial", sans-serif;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <a class="navbar-brand" href="#">Bootstrap Demo</a>
    </nav>
    <div id="carouselExample" class="carousel slide" data-ride="carousel">
      <ol class="carousel-indicators">
        <li
          data-target="#carouselExample"
          data-slide-to="0"
          class="active"
        ></li>
        <li data-target="#carouselExample" data-slide-to="1"></li>
        <li data-target="#carouselExample" data-slide-to="2"></li>
      </ol>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            class="d-block w-100"
            src="https://picsum.photos/200/300?image=100"
            alt="First slide"
          />
        </div>
        <div class="carousel-item">
          <img
            class="d-block w-100"
            src="https://picsum.photos/200/300?image=200"
            alt="Second slide"
          />
        </div>
        <div class="carousel-item">
          <img
            class="d-block w-100"
            src="https://picsum.photos/200/300?image=300"
            alt="Third slide"
          />
        </div>
      </div>
      <a
        class="carousel-control-prev"
        href="#carouselExample"
        role="button"
        data-slide="prev"
      >
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="sr-only">Previous</span>
      </a>
      <a
        class="carousel-control-next"
        href="#carouselExample"
        role="button"
        data-slide="next"
      >
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="sr-only">Next</span>
      </a>
    </div>
    <div class="container">
      <div class="row">
        <div class="col-sm-6 col-md-4 mb-4">
          <h1 class="text-primary">Heading Primary</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <h1 class="text-secondary">Heading Secondary</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <h1 class="text-success">Heading Success</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <h1 class="text-danger">Heading Danger</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <h1 class="text-warning">Heading Warning</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4">
          <h1 class="text-info">Heading Info</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4 bg-dark">
          <h1 class="text-light">Heading Light</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4 bg-light">
          <h1 class="text-dark">Heading Dark</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4 bg-primary text-white">
          <h1>Heading White on Primary</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4 bg-secondary text-white">
          <h1>Heading White on Secondary</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4 bg-primary text-dark">
          <h1>Heading Dark on Primary</h1>
        </div>
        <div class="col-sm-6 col-md-4 mb-4 bg-secondary text-dark">
          <h1>Heading Dark on Secondary</h1>
        </div>
      </div>
    </div>
  </body>
</html>
