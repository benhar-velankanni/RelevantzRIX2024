<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>People Table</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
      }

      table {
        border-collapse: collapse;
        border: 2px solid rgb(140 140 140);
        font-family: sans-serif;
        font-size: 0.8rem;
        letter-spacing: 1px;
      }

      caption {
        caption-side: bottom;
        padding: 10px;
        font-weight: bold;
      }

      thead,
      tfoot {
        background-color: rgb(228 240 245);
      }

      th,
      td {
        border: 1px solid rgb(160 160 160);
        padding: 8px 10px;
      }

      td:last-of-type {
        text-align: center;
      }

      tbody > tr:nth-of-type(even) {
        background-color: rgb(237 238 242);
      }

      tfoot th {
        text-align: right;
      }

      tfoot td {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        People and Their Intel
      </caption>
      <thead>
        <tr>
          <th>Person</th>
          <th>Most Interested In</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alice Johnson</td>
          <td>Photography</td>
          <td>28</td>
        </tr>
        <tr>
          <td>Bob Smith</td>
          <td>Cooking</td>
          <td>34</td>
        </tr>
        <tr>
          <td>Carol Davis</td>
          <td>Gardening</td>
          <td>42</td>
        </tr>
        <tr>
          <td>David Wilson</td>
          <td>Music</td>
          <td>26</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <th colspan="2">Average Age</th>
          <td>32.5</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
