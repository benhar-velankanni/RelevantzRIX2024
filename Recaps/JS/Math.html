<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Math Methods Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 20px;
        background-color: #f4f4f9;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .section {
        margin-bottom: 20px;
        padding: 15px;
        background: #fff;
        border-left: 5px solid #4caf50;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
      }
      .section h2 {
        margin-top: 0;
        color: #4caf50;
      }
      .output {
        background-color: #f9f9f9;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        white-space: pre-wrap;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript Math Methods Demo</h1>

    <div class="section">
      <h2>Math Constants</h2>
      <div class="output" id="mathConstantsOutput"></div>
    </div>
    <div class="section">
      <h2>Math Methods</h2>
      <div class="output" id="mathMethodsOutput"></div>
    </div>

    <script>
      // Math Constants
      document.getElementById("mathConstantsOutput").textContent =
        `Math.PI: ${Math.PI}\n` +
        `Math.E: ${Math.E}\n` +
        `Math.LN2: ${Math.LN2}\n` +
        `Math.LN10: ${Math.LN10}\n` +
        `Math.LOG2E: ${Math.LOG2E}\n` +
        `Math.LOG10E: ${Math.LOG10E}\n` +
        `Math.SQRT1_2: ${Math.SQRT1_2}\n` +
        `Math.SQRT2: ${Math.SQRT2}`;

      // Math Methods
      document.getElementById("mathMethodsOutput").textContent =
        `Math.abs(-7.25): ${Math.abs(-7.25)}\n` +
        `Math.ceil(4.4): ${Math.ceil(4.4)}\n` +
        `Math.floor(4.7): ${Math.floor(4.7)}\n` +
        `Math.round(4.5): ${Math.round(4.5)}\n` +
        `Math.max(1, 2, 3): ${Math.max(1, 2, 3)}\n` +
        `Math.min(1, 2, 3): ${Math.min(1, 2, 3)}\n` +
        `Math.random(): ${Math.random()}\n` +
        `Math.sqrt(16): ${Math.sqrt(16)}\n` +
        `Math.pow(2, 3): ${Math.pow(2, 3)}\n` +
        `Math.exp(1): ${Math.exp(1)}\n` +
        `Math.log(10): ${Math.log(10)}\n` +
        `Math.sin(Math.PI / 2): ${Math.sin(Math.PI / 2)}\n` +
        `Math.cos(Math.PI): ${Math.cos(Math.PI)}\n` +
        `Math.tan(Math.PI / 4): ${Math.tan(Math.PI / 4)}`;
    </script>
  </body>
</html>
