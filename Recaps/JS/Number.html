<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Number Methods Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 20px;
        background-color: #f4f4f9;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .section {
        margin-bottom: 20px;
        padding: 15px;
        background: #fff;
        border-left: 5px solid #4caf50;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
      }
      .section h2 {
        margin-top: 0;
        color: #4caf50;
      }
      .output {
        background-color: #f9f9f9;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        white-space: pre-wrap;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript Number Methods Demo</h1>

    <div class="section">
      <h2>Number Properties</h2>
      <div class="output" id="numberPropertiesOutput"></div>
    </div>
    <div class="section">
      <h2>Number Methods</h2>
      <div class="output" id="numberMethodsOutput"></div>
    </div>
    <div class="section">
      <h2>Math Methods</h2>
      <div class="output" id="mathMethodsOutput"></div>
    </div>

    <script>
      // Number Properties
      document.getElementById("numberPropertiesOutput").textContent =
        `MAX_VALUE: ${Number.MAX_VALUE}\n` +
        `MIN_VALUE: ${Number.MIN_VALUE}\n` +
        `POSITIVE_INFINITY: ${Number.POSITIVE_INFINITY}\n` +
        `NEGATIVE_INFINITY: ${Number.NEGATIVE_INFINITY}\n` +
        `NaN: ${Number.NaN}`;

      // Number Methods
      let num = 123.456;
      document.getElementById("numberMethodsOutput").textContent =
        `toFixed(2): ${num.toFixed(2)}\n` +
        `toExponential(2): ${num.toExponential(2)}\n` +
        `toPrecision(5): ${num.toPrecision(5)}\n` +
        `toString(): ${num.toString()}\n` +
        `valueOf(): ${num.valueOf()}`;

      // Math Methods
      document.getElementById("mathMethodsOutput").textContent =
        `Math.PI: ${Math.PI}\n` +
        `Math.abs(-7.25): ${Math.abs(-7.25)}\n` +
        `Math.ceil(4.4): ${Math.ceil(4.4)}\n` +
        `Math.floor(4.7): ${Math.floor(4.7)}\n` +
        `Math.round(4.5): ${Math.round(4.5)}\n` +
        `Math.max(1, 2, 3): ${Math.max(1, 2, 3)}\n` +
        `Math.min(1, 2, 3): ${Math.min(1, 2, 3)}\n` +
        `Math.random(): ${Math.random()}\n` +
        `Math.sqrt(16): ${Math.sqrt(16)}`;
    </script>
  </body>
</html>
