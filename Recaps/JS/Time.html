<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Date and Time Methods Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 20px;
        background-color: #f4f4f9;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      .section {
        margin-bottom: 20px;
        padding: 15px;
        background: #fff;
        border-left: 5px solid #4caf50;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        border-radius: 5px;
      }
      .section h2 {
        margin-top: 0;
        color: #4caf50;
      }
      .output {
        background-color: #f9f9f9;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        white-space: pre-wrap;
        font-family: monospace;
      }
    </style>
  </head>
  <body>
    <h1>JavaScript Date and Time Methods Demo</h1>

    <div class="section">
      <h2>Current Date and Time</h2>
      <div class="output" id="currentDateTimeOutput"></div>
    </div>
    <div class="section">
      <h2>Date Components</h2>
      <div class="output" id="dateComponentsOutput"></div>
    </div>
    <div class="section">
      <h2>Time Components</h2>
      <div class="output" id="timeComponentsOutput"></div>
    </div>
    <div class="section">
      <h2>Date Manipulation</h2>
      <div class="output" id="dateManipulationOutput"></div>
    </div>
    <div class="section">
      <h2>Date Formatting</h2>
      <div class="output" id="dateFormattingOutput"></div>
    </div>

    <script>
      // Current Date and Time
      let currentDate = new Date();
      document.getElementById(
        "currentDateTimeOutput"
      ).textContent = `Current Date and Time: ${currentDate}`;

      // Date Components
      let year = currentDate.getFullYear();
      let month = currentDate.getMonth() + 1; // Months are zero-based
      let day = currentDate.getDate();
      document.getElementById("dateComponentsOutput").textContent =
        `Year: ${year}\n` + `Month: ${month}\n` + `Day: ${day}`;

      // Time Components
      let hours = currentDate.getHours();
      let minutes = currentDate.getMinutes();
      let seconds = currentDate.getSeconds();
      document.getElementById("timeComponentsOutput").textContent =
        `Hours: ${hours}\n` + `Minutes: ${minutes}\n` + `Seconds: ${seconds}`;

      // Date Manipulation
      let manipulatedDate = new Date(currentDate);
      manipulatedDate.setDate(manipulatedDate.getDate() + 5); // Add 5 days
      manipulatedDate.setMonth(manipulatedDate.getMonth() - 1); // Subtract 1 month
      document.getElementById("dateManipulationOutput").textContent =
        `Original Date: ${currentDate}\n` +
        `Manipulated Date (Add 5 days, Subtract 1 month): ${manipulatedDate}`;

      // Date Formatting
      let options = {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      };
      let formattedDate = currentDate.toLocaleDateString("en-US", options);
      document.getElementById(
        "dateFormattingOutput"
      ).textContent = `Formatted Date: ${formattedDate}`;
    </script>
  </body>
</html>
