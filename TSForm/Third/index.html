<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <form id="emp_form">
    
  <div class="mb-3">
    <label for="" class="form-label">Name</label>
    <input
      type="text"
      class="form-control"
      name=""
   
      aria-describedby="helpId"
      placeholder=""
    />
    <div class="mb-3">
      <label for="" class="form-label">Position</label>
      <input
        type="text"
        class="form-control"
     
        id="position"
        aria-describedby="helpId"
        placeholder=""
      />
    </div>
    <div class="mb-3">
      <label for="" class="form-label">Salary</label>
      <input
        type="text"
        class="form-control"
      
        id="Salary"
        aria-describedby="helpId"
        placeholder=""
      />
    </div>
    <div class="mb-3">
      <label for="" class="form-label">Is Position</label>
      <input
        type="checkbox"
        class="form-check-input"
      
        id="isPosition"
        aria-describedby="helpId"
  
      />
     <button type="submit" id="submit" class="btn btn-primary">Submit</button>
    
    
    </form>
    

  

    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/employee.ts"></script>
    
  </body>
</html>
