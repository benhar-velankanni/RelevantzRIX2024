<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/formhandle.css">
    <title>Forms</title>
  </head>
  <body>
    <h3 align="center">Product Form</h3>
    <form id="exampleForm">
      <label for="productInput">Product Name:</label>
      <input type="text" id="productInput" name="productInput" />
      <br />
      <br />
      <label for="productPrice">Product Price:</label>
      <input type="number" id="productPrice" name="productPrice" />
      <br />
      <br />
      <label for="inStock">Instock:</label>
      <input type="checkbox" id="inStock" name="inStock" />
      <br />
      <button type="submit">Submit</button>
    </form>
    <br>
    <h3 align="center">Book Form</h3>
    <form id="book">
      <label for="title">Book Title:</label>
      <input type="text" id="title" name="title" />
      <br />
      <br />
      <label for="author">Author:</label>
      <input type="text" id="author" name="author" />
      <br />
      <br />
      <label for="pages">Pages:</label>
      <input type="number" id="pages" name="pages" />
      <br />
      <br />
      <label for="isavailable">IS Available</label>
      <input type="checkbox" id="isavailable" name="isavailable" />
      <br />
      <br />
      <button type="submit">Submit</button>
    </form>
    <br>
    <h3 align="center">Car Form</h3>
    <form id="car">
      <label for="make">Make:</label>
      <input type="text" id="make" name="make" />
      <br />
      <br />
      <label for="model">Model:</label>
      <input type="text" id="model" name="model" />
      <br />
      <br />
      <label for="year">Year:</label>
      <input type="number" id="year" name="year" />
      <br />
      <br />
      <label for="isrunning">Is Running:</label>
      <input type="checkbox" id="isrunning" name="isrunning" />
      <br>
      <button type="submit">Submit</button>
    </form>
    <br>
    <h3 align="center">Employee Form</h3>
    <form id="employee">
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" />
      <br />
      <br />
      <label for="position">Position:</label>
      <input type="number" id="position" name="position" />
      <br />
      <br />
      <label for="salary">Salary:</label>
      <input type="number" id="salary" name="salary" />
      <br />
      <br />
      <label for="isfulltime">Is Full Time:</label>
      <input type="checkbox" id="isfulltime" name="isfulltime" />
      <br />
      <br />
      <button type="submit">Submit</button>
    </form>
    <h3 align="center">Course Form</h3>
    <form id="course">
      <label for="coursename">Course Name:</label>
      <input type="text" id="coursename" name="coursename" />
      <br />
      <br />
      <label for="instructor">Instructor:</label>
      <input type="text" id="instructor" name="instructor" />
      <br />
      <br />
      <label for="duration">Duration:</label>
      <input type="number" id="duration" name="duration" />
      <br />
      <br />
      <label for="isonline">Is Online:</label>
      <input type="checkbox" id="isonline" name="isonline" />
      <br />
      <br />
      <button type="submit">Submit</button>
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
