<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200vh;
            background-image: url("bg.jpg");
            background-size: cover;
        }
        .form-container {
            background-color: rgb(233, 236, 239);
            padding: 100px;
            border-radius: 10px;
            color: black;
            align-items: center;
            width: 50%;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="password"],
        input[type="radio"],
        input[type="date"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .gender-group {
            display: flex;
            align-items: center;
            gap: 0.5px;
        }
        h2 {
            text-align: center;
        }
        button {
            background-color: #9264ed;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
    </style>
    <script>
        function validateForm() {
            var firstName = document.getElementById("FirstName").value;
            var age = document.getElementById("Age").value;
            var username = document.getElementById("username").value;
            var email = document.getElementById("email").value;
            var phone = document.getElementById("phone").value;
            var address = document.getElementById("Address").value;
            var dob = document.getElementById("DOB").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("ConfirmPassword").value;
            var occupation = document.getElementById("Occupation").value;
            var income = document.getElementById("Income").value;
            var genderMale = document.getElementById("Male").checked;
            var genderFemale = document.getElementById("Female").checked;
            var idProof = document.getElementById("ID").value;

            if (firstName == "") {
                alert("Name is required.");
                return false;
            }
            if (age == "") {
                alert("Age is required.");
                return false;
            }
            if (username == "") {
                alert("Username is required.");
                return false;
            }
            if (email == "") {
                alert("Email is required.");
                return false;
            }
            if (phone == "") {
                alert("Phone number is required.");
                return false;
            }
            if (address == "") {
                alert("Address is required.");
                return false;
            }
            if (dob == "") {
                alert("Date of Birth is required.");
                return false;
            }
            if (password == "") {
                alert("Password is required.");
                return false;
            }
            if (confirmPassword == "") {
                alert("Confirm Password is required.");
                return false;
            }
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                return false;
            }
            if (occupation == "") {
                alert("Occupation is required.");
                return false;
            }
            if (income == "") {
                alert("Income is required.");
                return false;
            }
            if (!genderMale && !genderFemale) {
                alert("Gender is required.");
                return false;
            }
            if (idProof == "") {
                alert("ID Proof is required.");
                return false;
            }

            alert("Registered successfully");
            return true;
        }
    </script>
</head>
<body>
    <form class="form-container" onsubmit="return validateForm()">
        <h2>Registration</h2>
        <div>
            <label for="name">Name</label>
            <input type="text" id="FirstName" name="FirstName" placeholder="Enter your Name">
        </div>
        <div>
            <label for="Age">Age</label>
            <input type="number" id="Age" name="Age" placeholder="Enter your Age">
        </div>
        <div>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
        </div>
        <div>
            <label for="phone">Phone No</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your Phone number">
        </div>
        <div>
            <label for="Address">Address</label>
            <input type="text" id="Address" name="Address" placeholder="Enter your Address">
        </div>
        <div>
            <label for="DOB">Date of Birth</label>
            <input type="date" id="DOB" name="DOB">
        </div>
        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password">
        </div>
        <div>
            <label for="ConfirmPassword">Confirm Password</label>
            <input type="password" id="ConfirmPassword" name="ConfirmPassword" placeholder="Enter your password to confirm">
        </div>
        <div>
            <label for="Occupation">Occupation</label>
            <select id="Occupation" name="Occupation">
                <option value="Student">Intern</option>
                <option value="Teacher">Developer</option>
                <option value="Engineer">Tester</option>
            </select>
        </div>
        <div>
            <label for="Income">Enter your Income</label>
            <input type="number" id="Income" name="Income" placeholder="Enter your Income">
        </div>
        <div class="gender-group">
            <label for="Gender">Gender:</label>
            <input type="radio" id="Male" name="Gender" value="Male">
            <label for="Male">Male</label>
            <input type="radio" id="Female" name="Gender" value="Female">
            <label for="Female">Female</label>
        </div>
        <div>
            <label for="ID">ID Proof</label>
            <input type="file" id="ID" name="ID">
        </div>
        <div>
            <button type="submit">Submit</button>
        </div>
    </form>
</body>
</html>
