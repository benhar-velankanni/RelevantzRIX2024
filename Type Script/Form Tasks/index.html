<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <link rel="stylesheet" href="src/style.css">
  </head>
  <body>
    <div id="app"></div>
    <div>
      <form>
        <h1>Product Section</h1>
        <table>
          <tr>
            <td><label>Name:</label></td>
            <td><input type="text" id="name"></td>
          </tr>
          <tr>
            <td><label>Price:</label></td>
            <td><input type="number" name="" id="price"></td>
          </tr>
          <tr>
            <td><label>Stock Available</label></td>
            <td><input type="checkbox" name="" id="stock"></td>
          </tr>
          <tr>
            <td><button id="bt1">Click For Product!</button></td>
          </tr>
        </table>
      </form>
      <div>
        <h1>Product Section List</h1>
        <div id="prodis"></div>
      </div>
    </div>
    <div>
      <form>
        <h1>Book Section List</h1>
        <table>
          <tr>
            <td><label>Title:</label></td>
            <td><input type="text" name="" id="btitle"></td>
          </tr>
          <tr>
            <td><label>Author:</label></td>
            <td><input type="text" name="" id="bauthor"></td>
          </tr>
          <tr>
            <td><label for="">Nof Pages:</label></td>
            <td><input type="number" id="bpage"></td>
          </tr>
          <tr>
            <td><label for="">Book Availability</label></td>
            <td><input type="checkbox" name="" id="bavailable"></td>
          </tr>
          <tr>
            <td><button id="bt2">Click For Book!</button></td>
          </tr>
        </table>
      </form>
    </div>
    <div>
      <form>
        <h1>Car Section List</h1>
        <table>
          <tr>
            <td><label for="">Make</label></td>
            <td><input type="text" name="" id="cmake"></td>
          </tr>
          <tr>
            <td><label for="">Model</label></td>
            <td><input type="text" id="cmodel"></td>
          </tr>
          <tr>
            <td><label for="">Year</label></td>
            <td><input type="number" name="" id="cyear"></td>
          </tr>
          <tr>
            <td><label for="">Running</label></td>
            <td><input type="checkbox" name="" id="crunning"></td>
          </tr>
          <tr>
            <td><button id="bt3">Click For Car!</button></td>
          </tr>
        </table>
      </form>
    </div>
    <div>
      <form>
        <h1>Employee Section List</h1>
        <table>
          <tr>
            <td><label for="">Name:</label></td>
            <td><input type="text" name="" id="ename"></td>
          </tr>
          <tr>
            <td><label for="">Position:</label></td>
            <td><input type="text" name="" id="eposition"></td>
          </tr>
          <tr>
            <td><label for="">Salary:</label></td>
            <td><input type="number" name="" id="esalary"></td>
          </tr>
          <tr>
            <td><label for="">Full Time Employee</label></td>
            <td><input type="checkbox" name="" id="efultime"></td>
          </tr>
          <tr>
            <td><button id="bt4">Click For Employee!</button></td>
          </tr>
        </table>
      </form>
    </div>
    <div>
      <form>
        <h1>Course Section List</h1>
        <table>
          <tr>
            <td><label for="">Title:</label></td>
            <td><input type="text" id="ctitle"></td>
          </tr>
          <tr>
            <td><label for="">Instructor</label></td>
            <td><input type="text" id="cinstructor"></td>
          </tr>
          <tr>
            <td><label for="">Duration</label></td>
            <td><input type="number" id="cduration"></td>
          </tr>
          <tr>
            <td><label for="">Online Mode</label></td>
            <td><input type="checkbox" name="" id="cmode"></td>
          </tr>
          <tr>
            <td><button id="bt5">Click For Course!</button></td>
          </tr>
        </table>
      </form>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
