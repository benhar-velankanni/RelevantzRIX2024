<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  
  <h3 align ="center">Product Form</h3>
  <form id="ProductForm">
    <label for="textInput">Name</label>
    <input type="text" id="textInput" name="textInput">
    <label for="price">Price</label>
    <input type="number" id="price" name="price">
    <label for="instock"  >Instock</label>
    <input type="checkbox" id="instock" name="instock">
    <button type="submit">Submit</button>
  </form>
  <h3 align="center">Book Form</h3>
  <form id="bookForm">
    
    <label for="title">Title</label>
    <input type="text" id="title" name="title">
    <label for="author">Author</label>
    <input type="text" id="author" name="author">
    <label for="pages">Pages</label>
    <input type="number" id="pages" name="pages">
    <label for="isAvailable">IsAvailable</label>
    <input type="checkbox" id="isAvailable" name="isAvailable">
    <button type="submit">Submit</button>
  </form>
  <h3 align="center">Car Form</h3>
  <form id="carForm">
    <label for="name">Name</label>
    <input type ="text" id="name" name="name">
    <label for ="model">Model</label>
    <input type="text" id="model" name="model">
    <label for="year">Year</label>
    <input type="number" id="year" name="year">
    <label for ="isRunning">IsRunning</label>
    <input type="checkbox" id="isRunning" name="isRunning">
    <button type="submit">Submit</button>
  </form>
  <h3 align="center">Employee Form</h3>
  <form id="employeeForm">
    <label for="name">Name</label>
    <input type="text" id="name" name="name">
    <label for ="position">Position</label>
    <input type="text" id="position" name="position">
    <label for="salary">Salary</label>
    <input type="number" id="salary" name="salary">
    <label for ="isFulltime">IsFulltime</label>
    <input type="checkbox" id="isFulltime" name="isFulltime">
    <button type="submit">Submit</button>
  </form>
  <h3 align="center">Course Form</h3>
  <form id="courseForm">
    <label for="name">Title</label>
    <input type="text" id="name" name="name">
    <label for ="instructor">Instructor</label>
    <input type="text" id="instructor" name="instructor">
    <label for="duration">Duration</label>
    <input type="number" id="duration" name="duration">
    <label for ="isOnline">IsOnline</label>
    <input type="checkbox" id="isOnline" name="isOnline">
    <button type="submit">Submit</button>
  </form>
</html>
