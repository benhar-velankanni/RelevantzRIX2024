<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>

  </body>
  <form id="productform">
    <h3> Product Form</h3>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="price">Price:</label>
    <input type="number" id="price" name="price" required>  

    <label for ="instock" >Instock:</label> 
    <input type="checkbox" id="instock" name="instock">

    <button type="submit">Submit</button>
  </form>

  <form id="bookform">

    <h3> Book Form</h3>

    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>

    <label for="author">Author:</label>
    <input type="text" id="author" name="author" required>

    <label for="pages">Pages:</label>
    <input type="number" id="pages" name="pages" required>

    <label for="isavailable">Available:</label>
    <input type="checkbox" id="isavailable" name="isavailable">

    <button type="submit">Submit</button>

  </form>

  <form id="carform">

    <h3> Car Form</h3>

    <label for="make">Make:</label>
    <input type="text" id="make" name="make" required>

    <label for="model">Model:</label>
    <input type="text" id="model" name="model" required>

    <label for="year">Year:</label>
    <input type="number" id="year" name="year" required>

    <label for="isrunning">Running:</label>
    <input type="checkbox" id="isrunning" name="isrunning">

    <button type="submit">Submit</button>

  </form>

  <form id="employeeform">

    <h3> Employee Form</h3>

    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="position">Position:</label>
    <input type="text" id="position" name="position" required>

    <label for="salary">Salary:</label>
    <input type="number" id="salary" name="salary" required>

    <label for="isfulltime">Full Time:</label>
    <input type="checkbox" id="isfulltime" name="isfulltime">

    <button type="submit">Submit</button>

  </form>

  <form id="courseform">

    <h3> Course Form</h3>

    <label for="title">Title:</label>
    <input type="text" id="title" name="title" required>

    <label for="instructor">Instructor:</label>
    <input type="text" id="instructor" name="instructor" required>

    <label for="duration">Duration:</label>
    <input type="number" id="duration" name="duration" required>

   <label for="isonline">Online:</label>
    <input type="checkbox" id="isonline" name="isonline">

    <button type="submit">Submit</button>



  </form>
</html>
