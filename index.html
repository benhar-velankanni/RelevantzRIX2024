<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <form id="exampleForm">
      <h2>Product Details</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" /><br><br>
      <label for="price">Price:</label>
      <input type="number" id="price" name="price" /><br><br>
      <label for="instock">Instock:</label>
      <input type="checkbox" id="instock" name="instock" /><br><br>
      <button type="submit">Submit</button>
    </form>

    <form id="bookForm">
      <h2>Book Details</h2>
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" /><br><br>
      <label for ="author">Author: </label>
      <input type="text" id="author" name="author" /><br><br>
      <label for="pages">Pages:</label>
      <input type="number" id="pages" name="pages" /><br><br>
      <label for="isAvailable">isAvailable:</label>
      <input type="checkbox" id="isAvailable" name="isAvailable" /><br><br>
      <button type="submit">Submit</button>
    </form>

    <form id="carform">
      <h2>Car Details</h2>
      <label for="make">Make:</label>
      <input type="text" id="make" name="make" /><br><br>
      <label for="model">Model:</label>
      <input type="text" id="model" name="model" /><br><br>
      <label for="year">Year:</label>
      <input type="number" id="year" name="year" /><br><br>
      <label for="isRunning">isRunning:</label>
      <input type="checkbox" id="isRunning" name="isRunning" /><br><br>
      <button type="submit">Submit</button>
    </form>

    <form id="employeeForm">
      <h2>Employee Details</h2>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name" /><br><br>
      <label for="position">Position:</label>
      <input type="text" id="position" name="position" /><br><br>
      <label for="salary">Salary:</label>
      <input type="number" id="salary" name="salary" /><br><br>
      <label for="isFulltime">isFulltime:</label>
      <input type="checkbox" id="isFulltime" name="isFulltime" /><br><br>
      <button type="submit">Submit</button>
    </form>

    <form id="courseForm">
      <h2>Course Details</h2>
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" /><br><br>
      <label for="instructor">Instructor:</label>
      <input type="text" id="instructor" name="instructor" /><br><br>
      <label for="duration">Duration:</label>
      <input type="number" id="duration" name="duration" /><br><br>
      <label for="isOnline">isOnline:</label>
      <input type="checkbox" id="isOnline" name="isOnline" /><br><br>
      <button type="submit">Submit</button>
    </form>
    
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
