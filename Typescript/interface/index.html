<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <form id="form">
      <!-- Product -->
      <h2>Product</h2>
      <label for="productId">ID:</label>
      <input type="number" id="productId" name="productId"><br><br>
      <label for="productName">Name:</label>
      <input type="text" id="productName" name="productName"><br><br>
      <label for="productPrice">Price:</label>
      <input type="number" id="productPrice" name="productPrice"><br><br>
      <label for="productInStock">In Stock:</label>
      <input type="checkbox" id="productInStock" name="productInStock"><br><br>
    
      <!-- Book -->
      <h2>Book</h2>
      <label for="bookId">ID:</label>
      <input type="number" id="bookId" name="bookId"><br><br>
      <label for="bookName">Name:</label>
      <input type="text" id="bookName" name="bookName"><br><br>
      <label for="bookAuthor">Author:</label>
      <input type="text" id="bookAuthor" name="bookAuthor"><br><br>
      <label for="bookPages">Pages:</label>
      <input type="number" id="bookPages" name="bookPages"><br><br>
    
      <!-- Car -->
      <h2>Car</h2>
      <label for="carId">ID:</label>
      <input type="number" id="carId" name="carId"><br><br>
      <label for="carName">Name:</label>
      <input type="text" id="carName" name="carName"><br><br>
      <label for="carMake">Make:</label>
      <input type="text" id="carMake" name="carMake"><br><br>
      <label for="carModel">Model:</label>
      <input type="text" id="carModel" name="carModel"><br><br>
      <label for="carYear">Year:</label>
      <input type="number" id="carYear" name="carYear"><br><br>
      <label for="carIsRunning">Is Running:</label>
      <input type="checkbox" id="carIsRunning" name="carIsRunning"><br><br>
    
      <!-- Employee -->
      <h2>Employee</h2>
      <label for="employeeId">ID:</label>
      <input type="number" id="employeeId" name="employeeId"><br><br>
      <label for="employeeName">Name:</label>
      <input type="text" id="employeeName" name="employeeName"><br><br>
      <label for="employeePosition">Position:</label>
      <input type="text" id="employeePosition" name="employeePosition"><br><br>
      <label for="employeeSalary">Salary:</label>
      <input type="number" id="employeeSalary" name="employeeSalary"><br><br>
      <label for="employeeIsFullTime">Is Full Time:</label>
      <input type="checkbox" id="employeeIsFullTime" name="employeeIsFullTime"><br><br>
    
      <!-- Course -->
      <h2>Course</h2>
      <label for="courseId">ID:</label>
      <input type="number" id="courseId" name="courseId"><br><br>
      <label for="courseName">Name:</label>
      <input type="text" id="courseName" name="courseName"><br><br>
      <label for="courseInstructor">Instructor:</label>
      <input type="text" id="courseInstructor" name="courseInstructor"><br><br>
      <label for="courseDuration">Duration:</label>
      <input type="number" id="courseDuration" name="courseDuration"><br><br>
      <label for="courseIsOnline">Is Online:</label>
      <input type="checkbox" id="courseIsOnline" name="courseIsOnline"><br><br>
    
      <input type="submit" value="Submit">
    </form>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
