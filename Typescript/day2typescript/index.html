<!DOCTYPE html>

  <head>
    <meta charset="UTF-8" />

    <title>Vite + TS + React</title>
    <link rel="stylesheet" type  ="text/css" href="./src/index.css" />
  </head>
  <body>
    <div className="Main-container">
      <div className="Product-container">
        <form id="productform">
          <table>
            <tr>
              <td>
                <label htmlFor="name">Name:</label>
              </td>
              <td>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Enter your name"
                />
              </td>
            </tr>
            <tr>
              <td>
                <label htmlFor="price">Price:</label>
              </td>
              <td>
                <input

                  id="price"
                  name="price"
                  placeholder="Enter your price"
                />
              </td>
            </tr>
            <tr>
              <td>
                <label htmlFor="inStock">In Stock:</label>
              </td>
              <td>
                <input type="checkbox" id="inStock" name="inStock" />
              </td>
            </tr>
            <tr>
              <td>
                <button type="submit">Submit</button>
              </td>
            </tr>
          </table>
        </form>
      </div>
      <!-- gap for form-->

            <tr>
              <td>
                <label htmlFor="isAvailable">Is Available:</label>

              <td>
                <input type="checkbox" id="isAvailable" name="isAvailable" />
              </td>
            </tr>
            <tr>
              <td>
                <button type="submit">Submit</button>
              </td>
            </tr>

      import { handleSubmit } from '/src/main.ts';
 
      document.getElementById("productform").onsubmit = handleSubmit;
      document.getElementById("bookform").onsubmit = handleSubmit;
      document.getElementById("carform").onsubmit = handleSubmit;
      document.getElementById("employeeform").onsubmit = handleSubmit;
      document.getElementById("courseform").onsubmit = handleSubmit;
