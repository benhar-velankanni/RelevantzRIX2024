<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" type="text/css" href="form.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms</title>
</head>
<body>
  <h1>Product Form</h1>
  <form id="product-form">
    <label for="product-name">Name:</label>
    <input type="text" id="product-name" name="product-name"><br><br>
    <label for="product-price">Price:</label>
    <input type="number" id="product-price" name="product-price"><br><br>
    <label for="product-in-stock">In Stock:</label>
    <input type="checkbox" id="product-in-stock" name="product-in-stock"><br><br>
    <button id="product-submit-btn">Submit</button>
  </form>

  <h1>Book Form</h1>
  <form id="book-form">
    <label for="book-title">Title:</label>
    <input type="text" id="book-title" name="book-title"><br><br>
    <label for="book-author">Author:</label>
    <input type="text" id="book-author" name="book-author"><br><br>
    <label for="book-pages">Pages:</label>
    <input type="number" id="book-pages" name="book-pages"><br><br>
    <label for="book-is-available">Is Available:</label>
    <input type="checkbox" id="book-is-available" name="book-is-available"><br><br>
    <button id="book-submit-btn">Submit</button>
  </form>

  <h1>Car Form</h1>
  <form id="car-form">
    <label for="car-make">Make:</label>
    <input type="text" id="car-make" name="car-make"><br><br>
    <label for="car-model">Model:</label>
    <input type="text" id="car-model" name="car-model"><br><br>
    <label for="car-year">Year:</label>
    <input type="number" id="car-year" name="car-year"><br><br>
    <label for="car-is-running">Is Running:</label>
    <input type="checkbox" id="car-is-running" name="car-is-running"><br><br>
    <button id="car-submit-btn">Submit</button>
  </form>

  <h1>Employee Form</h1>
  <form id="employee-form">
    <label for="employee-name">Name:</label>
    <input type="text" id="employee-name" name="employee-name"><br><br>
    <label for="employee-position">Position:</label>
    <input type="text" id="employee-position" name="employee-position"><br><br>
    <label for="employee-salary">Salary:</label>
    <input type="number" id="employee-salary" name="employee-salary"><br><br>
    <label for="employee-is-full-time">Is Full-time:</label>
    <input type="checkbox" id="employee-is-full-time" name="employee-is-full-time"><br><br>
    <button id="employee-submit-btn">Submit</button>
  </form>

  <h1>Course Form</h1>
  <form id="course-form">
    <label for="course-title">Title:</label>
    <input type="text" id="course-title" name="course-title"><br><br>
    <label for="course-instructor">Instructor:</label>
    <input type="text" id="course-instructor" name="course-instructor"><br><br>
    <label for="course-duration">Duration:</label>
    <input type="number" id="course-duration" name="course-duration"><br><br>
    <label for="course-is-online">Is Online:</label>
    <input type="checkbox" id="course-is-online" name="course-is-online"><br><br>
    <button id="course-submit-btn">Submit</button>
  </form>

  <script src="src/product.ts"></script>
</body>
</html>
