<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Form</title>
</head>
<body>
  <h1>Course Form</h1>
  <form id="course-form">
    <label for="title">Title:</label>
    <input type="text" id="title" name="title"><br><br>
    <label for="instructor">Instructor:</label>
    <input type="text" id="instructor" name="instructor"><br><br>
    <label for="duration">Duration (hours):</label>
    <input type="number" id="duration" name="duration"><br><br>
    <label for="isOnline">Is Online:</label>
    <input type="checkbox" id="isOnline" name="isOnline"><br><br>
    <button id="submit-btn">Submit</button>
  </form>

  <script src="src/course.ts"></script>
</body>
</html>
