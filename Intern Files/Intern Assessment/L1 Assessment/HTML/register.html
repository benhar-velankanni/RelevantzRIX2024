<!doctype html>
<html lang="en">
    <head>
        <title>Kaira register</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.2.1 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="register.css">

        <script src="script.js"></script>        
    </head>

    <body>
        <main>
            <div
                class="container"
            >
                <h1 style="padding: 10px;">KAIRA REGISTER</h1>
                <form novalidate>
                    <div class="form-floating mb-3">
                        <input type="name" class="form-control" id="username" placeholder="Username">
                        <label for="floatingInput">Username</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="age" class="form-control" id="age" placeholder="Age">
                        <label for="floatingInput">Age</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="mail" placeholder="Email">
                        <label for="floatingInput">Email</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="phone" placeholder="Mobile Number">
                        <label for="floatingInput">Mobile Number</label>
                      </div>
                      <div class="form-floating">
                        <textarea class="form-control" placeholder="Address" id="address"></textarea>
                        <label for="floatingTextarea">Address</label>
                      </div>
                      <div class="form-floating">
                        <input type="password" class="form-control" id="password" placeholder="Password">
                        <label for="floatingPassword">Password</label>
                      </div>
                      <div class="form-floating">
                        <input type="password" class="form-control" id="confirmpassword" placeholder=" Confirm Password">
                        <label for="floatingPassword">Confirm Password</label>
                      </div>
                      <div class="form-floating mb-3">
                        <input type="number" class="form-control" id="income" placeholder="Income">
                        <label for="floatingInput">Income</label>
                      </div>
                      <div class="form-floating mb-3">
                        <select class="form-select" id="occupation" aria-label="Default select example">
                            <option default>Occupation</option>
                            <option value="HR">HR</option>
                            <option value="Developer">Developer</option>
                            <option value="Teacher">Teacher</option>
                          </select>
                      </div>
                      <div class="form-check-inline">
                        <label for="Gender">Gender:</label>&nbsp; &nbsp; &nbsp;
                        <input class="form-check-input" type="radio" name="gender" id="male">
                        <label class="form-check-label" for="flexRadioDefault1">
                          Male
                        </label>&nbsp; &nbsp; &nbsp;
                        <input class="form-check-input" type="radio" name="gender" id="female">
                        <label class="form-check-label" for="flexRadioDefault2">
                          Female
                        </label>
                      </div>
                      <div class="input-group mb-3">
                        <input type="file" class="form-control" id="id">
                        <label class="input-group-text" for="inputGroupFile02">Upload ID</label>
                      </div>
                      <button type="submit" class="btn btn-primary" onclick="register(event)">Register</button>
                </form>
                <br>
                Do have an account? <a href="login.html">Login</a>
            </div>
            
        </main>
        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
