<!DOCTYPE html>
<html>
  <head>
    <title>Product Registration Form</title>
    <link rel="stylesheet" href="./CSS/Product.css" />
  </head>
  <body>
    <video muted autoplay loop src="./Media/BackgroundVideo.mp4"></video>
    <h2 style="text-align: center; color: white">PRODUCT REGISTRATION FORM</h2>
    <div class="form-container">
      <form>
        <table>
          <tr>
            <td>
              <label for="product-name">Product Name:</label>
            </td>
            <td>
              <input
                type="text"
                id="product-name"
                name="product_name"
                required
              />
            </td>
          </tr>
          <tr>
            <td>
              <label for="model-number">Model Number:</label>
            </td>
            <td>
              <input
                type="text"
                id="model-number"
                name="model_number"
                required
              />
            </td>
          </tr>
          <tr>
            <td>
              <label for="serial-number">Serial Number:</label>
            </td>
            <td>
              <input
                type="text"
                id="serial-number"
                name="serial_number"
                required
              />
            </td>
          </tr>
          <tr>
            <td>
              <label for="purchase-date">Purchase Date:</label>
            </td>
            <td>
              <input
                type="date"
                id="purchase-date"
                name="purchase_date"
                required
              />
            </td>
          </tr>
          <tr>
            <td>
              <label for="purchase-place">Place of Purchase:</label>
            </td>
            <td>
              <input type="text" id="purchase-place" name="purchase_place" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="warranty">Warranty Period:</label>
            </td>
            <td>
              <select id="warranty" name="warranty">
                <option value="1_year">1 Year</option>
                <option value="2_years">2 Years</option>
                <option value="3_years">3 Years</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>
              <label for="owner-name">Owner's Name:</label>
            </td>
            <td>
              <input type="text" id="owner-name" name="owner_name" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="email">Email Address:</label>
            </td>
            <td>
              <input type="email" id="email" name="email" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="phone">Phone Number:</label>
            </td>
            <td>
              <input type="tel" id="phone" name="phone" />
            </td>
          </tr>
          <tr>
            <td>
              <label for="additional-notes">Additional Notes:</label>
            </td>
            <td>
              <textarea
                id="additional-notes"
                name="additional_notes"
                rows="4"
              ></textarea>
            </td>
          </tr>
          <tr>
            <td>
              <input type="reset" class="Reset" value="Reset" />
              <input type="submit" class="Submit" value="Submit" />
            </td>
          </tr>
        </table>
      </form>
    </div>
  </body>
</html>
