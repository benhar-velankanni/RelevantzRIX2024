<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
      }

      .backgroundvideo {
        position: fixed;
        right: 0;
        bottom: 0;
        width: 100vw;
        z-index: -1;
      }

      .calculator {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        border-radius: 5px;
        width: 250px;
        height: auto;
        background-color: white;
      }

      button {
        width: 100%;
        padding: 10px;
        margin: 5px;
        font-size: 20px;
        border: 1px solid black;
        border-radius: 5px;
        background-color: black;
        color: white;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background-color: white;
        color: black;
        border: 1px solid black;
      }

      #result {
        width: 70%;
        padding: 10px;
        margin: 5px;
        font-size: 20px;
        border: 1px solid gray;
        border-radius: 5px;
        background-color: white;
        color: black;
        cursor: pointer;
        transition: 0.3s;
      }

      td {
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <video
      class="backgroundvideo"
      autoplay
      muted
      loop
      src="./Media/BackgroundVideo.mp4"
    ></video>
    <div class="calculator">
      <input type="text" id="result" disabled />
      <table>
        <tr>
          <td colspan="4"><button onclick="clearValue()">C</button></td>
        </tr>
        <tr>
          <td><button onclick="appendValue()" value="7">7</button></td>
          <td><button onclick="appendValue()" value="8">8</button></td>
          <td><button onclick="appendValue()" value="9">9</button></td>
          <td><button onclick="appendValue()" value="+">+</button></td>
        </tr>
        <tr>
          <td><button onclick="appendValue()" value="4">4</button></td>
          <td><button onclick="appendValue()" value="5">5</button></td>
          <td><button onclick="appendValue()" value="6">6</button></td>
          <td><button onclick="appendValue()" value="-">-</button></td>
        </tr>
        <tr>
          <td><button onclick="appendValue()" value="1">1</button></td>
          <td><button onclick="appendValue()" value="2">2</button></td>
          <td><button onclick="appendValue()" value="3">3</button></td>
          <td><button onclick="appendValue()" value="*">*</button></td>
        </tr>
        <tr>
          <td colspan="2">
            <button onclick="appendValue()" value="0">0</button>
          </td>
          <td><button onclick="appendValue()" value=".">.</button></td>
          <td><button onclick="appendValue()" value="/">/</button></td>
        </tr>
        <tr>
          <td colspan="4">
            <button onclick="evalResult()" value="=">=</button>
          </td>
        </tr>
      </table>
    </div>
  </body>
</html>
<script>
  function appendValue() {
    document.getElementById("result").value += event.target.value;
  }

  function clearValue() {
    document.getElementById("result").value = "";
  }

  function evalResult() {
    document.getElementById("result").value = eval(
      document.getElementById("result").value
    );
  }
</script>
