<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Calculator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }
        .calculator {
            width: 300px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .display {
            width: 100%;
            height: 50px;
            margin-bottom: 15px;
            font-size: 1.5rem;
            text-align: right;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .buttons button {
            height: 50px;
            font-size: 1.2rem;
            background-color: #007BFF;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .buttons button:hover {
            background-color: #0056b3;
        }
        .buttons .clear {
            background-color: #FF6347;
        }
        .buttons .clear:hover {
            background-color: #d13b2f;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">/</button>
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">*</button>
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">-</button>
            <button class="number">0</button>
            <button class="operator">.</button>
            <button class="equal">=</button>
            <button class="operator">+</button>
            <button class="clear" colspan="2">C</button>
        </div>
    </div>
 
    <script>
        $(document).ready(function() {
            let input = "";
   
            // Function to set the display value
            function updateDisplay(value) {
                $("#display").val(value);
            }
   
            // Handle button clicks
            $(".number, .operator").click(function() {
                input += $(this).text();
                updateDisplay(input);
            });
   
            // Handle the clear button click
            $(".clear").click(function() {
                input = "";
                updateDisplay("");
            });
   
            // Handle the equal button click
            $(".equal").click(function() {
                try {
                    input = eval(input).toString();
                    updateDisplay(input);
                } catch {
                    updateDisplay("Error");
                    input = "";
                }
            });
   
            // Handle keyboard input
            $(document).on("keydown", function(event) {
                const key = event.key;
   
                if (!isNaN(key) || "+-*/.".includes(key)) {
                    // If key is a number or operator, append it to the input
                    input += key;
                    updateDisplay(input);
                } else if (key === "Enter") {
                    // If Enter key is pressed, calculate the result
                    try {
                        input = eval(input).toString();
                        updateDisplay(input);
                    } catch {
                        updateDisplay("Error");
                        input = "";
                    }
                } else if (key === "Backspace") {
                    // If Backspace key is pressed, remove the last character
                    input = input.slice(0, -1);
                    updateDisplay(input);
                } else if (key === "Escape") {
                    // If Escape key is pressed, clear the input
                    input = "";
                    updateDisplay("");
                }
            });
        });
    </script>
   
</body>
</html>
