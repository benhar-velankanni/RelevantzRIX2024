<script>
    let a = 10;
    let b = 20;
    let c = a + b;
    document.write(c, "<br>");
    let d = a - b;
    document.write(d, "<br>");
    let e = a * b;
    document.write(e, "<br>");
    let f = a / b;
    document.write(f, "<br>");
    let g = a % b;
    document.write(g, "<br>");
    let h = a ** b;
    document.write(h, "<br>");
    let i = a++;
    document.write(i, "<br>");
    let j = a--;
    document.write(j, "<br>");
</script>
