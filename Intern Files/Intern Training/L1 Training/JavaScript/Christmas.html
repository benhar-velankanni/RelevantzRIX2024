<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Days for Christmas</title>
  </head>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: black;
      font: 14px Arial, sans-serif;
      font-weight: bold;
    }

    #user_input,
    #end_result {
      padding: 10px;
      font-size: 16px;
      border: 1px solid white;
      border-radius: 5px;
      outline: none;
      color: black;
      background-color: white;
      font: 14px Arial, sans-serif;
      font-weight: bold;
    }

    #user_input{
        padding: 10px 45px;
    }

    button {
      margin: 5px;
      padding: 10px 10px;
      font-size: 16px;
      border: 1px solid white;
      border-radius: 5px;
      background-color: white;
      color: black;
      cursor: pointer;
      transition: 0.3s;
      font: 14px Arial, sans-serif;
      font-weight: bold;
    }

    button:hover {
      background-color: black;
      color: white;
      border: 1px solid white;
    }
  </style>
  <body>
    <table>
      <tr>
        <td>
          <input type="date" id="user_input" placeholder="Input" />
        </td>
        <td><button onclick="FindDaysLeft()">Calculate</button></td>
        <td><button onclick="ResetInput()">Reset</button></td>
      </tr>
      <tr>
        <td>
          <input type="text" id="end_result" placeholder="Output" disabled />
        </td>
      </tr>
    </table>
  </body>
</html>
<script>
  function ResetInput() {
    document.getElementById("user_input").value = "";
    document.getElementById("end_result").value = "";
  }

  function FindDaysLeft() {
    var inputDate = new Date(document.getElementById("user_input").value);
    var currYear = new Date().getFullYear();
    var christmasDate = new Date(currYear, 11, 25);
    if(inputDate > christmasDate){
        christmasDate = new Date(currYear + 1, 11, 25);
    }
    var resultTime = Math.abs(inputDate - christmasDate);
    var resultDays = Math.ceil(resultTime / (10000 * 60 * 60 * 24));
    document.getElementById("end_result").value = resultDays;
}

</script>
