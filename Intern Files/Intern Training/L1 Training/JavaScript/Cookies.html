<html lang="en">

      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <form>
      <div class="mb-3">
        <label for="exampleInputName" class="form-label">Name</label>
        <input
          type="email"
          class="form-control"
          id="employeeName"
          aria-describedby="emailHelp"
        />
      </div>
      <button class="btn btn-primary" onclick="registerEmployee()">Submit</button>
      <button class="btn btn-primary" onclick="loginEmployee()">Get</button>
    </form>

  </body>

<script

></script>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
  integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
  crossorigin="anonymous"
></script>

<script>
    // Function to set a cookie
    function setCookie(name, value, days) {
        let date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        let expires = "; expires=" + date.toUTCString();
        document.cookie = name + "=" + value + expires + "; path=/";
    }

    // Function to get a specific cookie
    function getCookie(name) {
        let decodedCookies = decodeURIComponent(document.cookie);
        let cookiesArray = decodedCookies.split(';');
        for (let i = 0; i < cookiesArray.length; i++) {
            let cookie = cookiesArray[i].trim();
            if (cookie.indexOf(name + "=") == 0) {
                return cookie.substring(name.length + 1, cookie.length);
            }
        }
        return null;
    }

    // Function triggered on employee registration
    function registerEmployee() {
        let employeeName = document.getElementById("employeeName").value;
        let registrationDate = new Date().toISOString().split('T')[0];

        if (employeeName) {
            setCookie("employeeName", employeeName, 7);
            setCookie("registrationDate", registrationDate, 7);
            alert("Employee registered successfully!");
        } else {
            alert("Please enter an employee name.");
        }
    }

    // Function triggered on login
    function loginEmployee() {
        let employeeName = getCookie("employeeName");
        let registrationDate = getCookie("registrationDate");

        if (employeeName && registrationDate) {
            alert(`Welcome back, ${employeeName}! You registered on ${registrationDate}.`);
        } else {
            alert("No employee data found. Please register.");
        }
    }
</script>
