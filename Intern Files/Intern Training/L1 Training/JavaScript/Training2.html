<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training 2</title>

    <style>
      body {
        background-color: white;
        font: 12px Arial, sans-serif;
        font-weight: bold;
        display: flex;
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(2, 1fr);
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      input {
        margin: auto;
        width: 90%;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        font-weight: bold;
        font: 12px Arial, sans-serif;
        border: 1px solid black;
        padding: 15px 10px;
        border-radius: 5px;
        transition: 0.5s;
      }

      input:hover {
        background-color: black;
        color: white;
        border: 1px solid black;
        font-weight: bold;
        font: 12px Arial, sans-serif;
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <input type="text" id="result1" disabled />
    <input type="text" id="result2" disabled />
  </body>
</html>
<script>
  var emp = new Object();
  emp.id = 101;
  emp.name = "John";
  emp.salary = 50000;
  //   document.write(
  //     "<br><br>" + emp.id + "<br>" + emp.name + "<br>" + emp.salary + "<br>"
  //   );

  //=====================================================================================

  //   If - Else
  var age = 32;
  if (age >= 18) {
    document.getElementById("result1").value = "You are eligible to vote";
  } else {
    document.getElementById("result1").value = "You are not eligible to vote";
  }

  //=====================================================================================

  //   Switch
  var day = 3;
  switch (day) {
    case 1:
      document.getElementById("result2").value = "Sunday";
      break;
    case 2:
      document.getElementById("result2").value = "Monday";
      break;
    case 3:
      document.getElementById("result2").value = "Tuesday";
      break;
    case 4:
      document.getElementById("result2").value = "Wednesday";
      break;
    case 5:
      document.getElementById("result2").value = "Thursday";
      break;
    case 6:
      document.getElementById("result2").value = "Friday";
      break;
    case 7:
      document.getElementById("result2").value = "Saturday";
      break;
    default:
      document.getElementById("result2").value = "Invalid Day";
  }

  //=====================================================================================

  //   For Loop
  var i;
  for (i = 0; i < 5; i++) {
    document.write(i + "<br>");
  }
  document.write("<br><br>");

  //=====================================================================================

  //   While Loop
  var j = 0;
  while (j < 5) {
    document.write(j + "<br>");
    j++;
  }
  document.write("<br><br>");

  //=====================================================================================

  //   Do While Loop
  var k = 0;
  do {
    document.write(k + "<br>");
    k++;
  } while (k < 5);
  document.write("<br><br>");

  //=====================================================================================
</script>
