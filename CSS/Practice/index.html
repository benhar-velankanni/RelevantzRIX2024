<!DOCTYPE html>
<html>
<head>
  <title>Homepage with List Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    .navbar {
      background-color: #333;
      overflow: hidden;
      padding: 0;
      margin: 0;
    }
    .navbar ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
      display: flex;
    }
    .navbar li {
      flex: 1;
    }
    .navbar a {
      display: block;
      color: white;
      text-align: center;
      padding: 14px 20px;
      text-decoration: none;
    }
    .navbar a:hover {
      background-color: #ddd;
      color: black;
    }
    .content {
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">Phone</a></li>
      <li><a href="#">About</a></li>
    </ul>
  </div>
  <div class="content">
    <h1>Welcome to My Homepage</h1>
    <p>This is a simple homepage with a navigation list.</p>
  </div>
</body>
</html>
